[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
mime_guess = "2.0.5"
rust-embed = "8.12.0"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["net", "signal", "macros", "rt-multi-thread"] }
app-core = { path = "../app-core" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
