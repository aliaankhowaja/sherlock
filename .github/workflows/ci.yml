name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # nightly full gate

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Same checks as scripts/test-fast.sh (no evaluation, no live-server tests).
  fast:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      # Get the code
      - uses: actions/checkout@v4
      # Node for the web app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # uv for the two Python projects
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      # Rust with clippy and rustfmt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Cache cargo registry and target dir
      - uses: Swatinem/rust-cache@v2
      # Web app: install, lint, build (the api crate embeds ui/dist, so this must run before cargo)
      - run: cd ui && npm ci && npm run lint && npm run build
      # Harness tests
      - run: cd harness && uv run pytest -q
      # Recorder tests that need no live langgraph server
      - run: cd python/sherlock && uv run pytest -q --ignore=tests/test_g3_live.py --ignore=tests/test_eval_results.py
      # Rust tests
      - run: cargo test -p app-core -p api -p cli
      # Lint and formatting
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  # Whole scripts/test.sh, including live langgraph tests and the ~5 minute evaluation.
  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Full pre-deploy gate
      - run: bash scripts/test.sh

  # Deployment evidence: release binary and Python wheel as artifacts (nothing is published).
  build:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Web app first (embedded in the binary)
      - run: cd ui && npm ci && npm run build
      # Release binary
      - run: cargo build --release -p cli
      # Python wheel
      - run: cd python/sherlock && uv build
      # Upload both
      - uses: actions/upload-artifact@v4
        with:
          name: sherlock-linux-binary
          path: target/release/sherlock
      - uses: actions/upload-artifact@v4
        with:
          name: sherlock-python-wheel
          path: python/sherlock/dist/*
