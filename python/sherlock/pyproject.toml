[project]
name = "sherlock"
version = "0.0.0"
description = "Sherlock recorder: record a LangGraph run once, replay it from a cassette, never call live (spec 4.2)"
requires-python = ">=3.12,<3.14"
dependencies = ["pyyaml>=6", "jsonschema>=4"]

[project.scripts]
sherlock-rec = "sherlock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sherlock"]

[dependency-groups]
dev = ["pytest", "httpx", "langgraph>=1.2.5,<2", "langgraph-cli[inmem]"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
